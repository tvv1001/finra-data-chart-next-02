# Deploy Next.js app to Vercel
#
# Deploy Next.js app to Vercel after search-focused validation passes.
#
# Required GitHub repository secrets:
#   VERCEL_TOKEN      – personal access token from vercel.com/account/tokens
#   VERCEL_ORG_ID     – from .vercel/project.json (teamId) after `vercel link`
#   VERCEL_PROJECT_ID – from .vercel/project.json (projectId) after `vercel link`
#
# Required Vercel environment variables (set in Vercel project settings):
#   UPSTASH_REDIS_REST_URL
#   UPSTASH_REDIS_REST_TOKEN

name: Deploy to Vercel

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'vercel-production'
  cancel-in-progress: false

jobs:
  search-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run search regression tests
        run: pnpm exec vitest run tests/unit/local-search.spec.ts tests/unit/graph-search-route.spec.ts

  deploy:
    needs: search-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test production search
        run: |
          node - <<'NODE'
          (async () => {
            const url = 'https://finra-data-chart-next-02.vercel.app/api/finra/search?q=mason&limit=5';
            const response = await fetch(url);
            const payload = await response.json();
            if (!response.ok) {
              throw new Error(`Search smoke test failed with HTTP ${response.status}`);
            }
            if (!payload || typeof payload.total !== 'number' || payload.total <= 0) {
              throw new Error(`Search smoke test failed: expected results for mason, got ${JSON.stringify(payload)}`);
            }
            console.log(`Production search smoke test passed with total=${payload.total}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
