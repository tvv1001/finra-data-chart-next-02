[package]
name = "graph-layout"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
rayon = { version = "1.7", optional = true }
wasm-bindgen-rayon = { version = "0.3", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[features]
default = []
parallel = ["rayon", "wasm-bindgen-rayon"]
